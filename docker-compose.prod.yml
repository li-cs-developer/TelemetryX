services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/telemetryx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/var/www/static:ro
    depends_on:
      - web
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    expose:
      - "8000"
    env_file:
      - .env.prod
    volumes:
      - staticfiles:/app/staticfiles
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    command: celery -A telemetryx.celery:app worker -l info
    env_file:
      - .env.prod
    depends_on:
      - redis
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: Dockerfile.prod
    command: celery -A telemetryx.celery:app beat -l info
    env_file:
      - .env.prod
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  staticfiles: